<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or '모임 날짜 조율' }}</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --good: #166534;
      --shadow: 0 8px 30px rgba(0,0,0,0.05);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
    h1,h2,h3 { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .row > .field { flex: 1 1 250px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="text"], input[type="date"], textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; background: #fff; }
    textarea { min-height: 90px; resize: vertical; }
    .btn { display: inline-block; border: none; border-radius: 12px; padding: 12px 16px; background: var(--primary); color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn.secondary { background: #111827; }
    .btn.ghost { background: #eef2ff; color: #1e3a8a; }
    .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--primary-soft); color: #1d4ed8; }
    .notice { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 12px; padding: 12px 14px; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
    .months { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .month { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .month h3 { padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fafafa; }
    .calendar { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .calendar th, .calendar td { border: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; height: 90px; }
    .calendar th { font-size: 13px; color: var(--muted); background: #fcfcfd; }
    .day-box { display: flex; flex-direction: column; gap: 6px; }
    .day-num { font-weight: 800; font-size: 14px; }
    .out { background: #f9fafb; color: #c0c4cc; }
    .disabled-cell { background: #f9fafb; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .summary-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; }
    .summary-card.best { background: #dcfce7; border-color: #86efac; }
    .count { font-size: 28px; font-weight: 800; }
    .list { padding-left: 18px; margin: 10px 0 0; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
    .good { color: var(--good); font-weight: 800; }
    .inline-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    code.link { display: block; background: #111827; color: #fff; padding: 12px 14px; border-radius: 12px; overflow-wrap: anywhere; }
    @media (max-width: 640px) { body { padding: 12px; } .calendar th, .calendar td { height: 72px; padding: 4px; } .day-num { font-size: 12px; } }
  </style>
</head>
<body>
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
